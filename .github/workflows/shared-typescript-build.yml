name: Shared TypeScript build

# Product is the Expo mobile app; web/ is not a shipping target. CI only compiles shared types.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared-build:
    name: Shared package TypeScript compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile shared package (TypeScript)
        run: npm run build --workspace shared
