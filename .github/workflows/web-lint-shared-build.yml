name: Web lint and shared build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-lint-shared-build:
    name: Web ESLint and shared TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eslint-config-next is hoisted to root node_modules; `next` stays under web/node_modules (workspace isolation).
      - name: Run Next.js ESLint (web)
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules:${{ github.workspace }}/node_modules
        run: npm run lint --workspace web

      - name: Compile shared package (TypeScript)
        run: npm run build --workspace shared
